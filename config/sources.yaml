# COFA FORWARD — data source catalog
# Status values (per spec): implemented_and_tested, implemented_but_not_verified,
# requires_credentials, requires_manual_import, planned, unavailable
# Verified via extensive online research 2026-10-28 (see docs/DATA_SOURCES.md).
sources:
  - id: open-meteo-forecast
    name: "Open-Meteo Forecast API"
    publisher: "Open-Meteo"
    url: "https://open-meteo.com/"
    api: "https://api.open-meteo.com/v1/forecast"
    license: "Data CC BY 4.0"
    geographic_coverage: "Global; covers Palau, FSM, RMI points"
    spatial_resolution: "~11 km model grid"
    temporal_resolution: "hourly + daily; 16-day horizon"
    update_frequency: "Multiple runs per day"
    auth: "none"
    variables: "temperature_2m, precipitation, wind_speed_10m, wind_direction_10m, relative_humidity_2m, surface_pressure, ..."
    implementation_status: implemented_and_tested
    verification_date: "2026-10-28"

  - id: open-meteo-archive
    name: "Open-Meteo Historical Weather API (ERA5-based)"
    publisher: "Open-Meteo / ECMWF ERA5"
    url: "https://open-meteo.com/en/docs/historical-weather-api"
    api: "https://archive-api.open-meteo.com/v1/archive"
    license: "ERA5 data CC BY 4.0"
    geographic_coverage: "Global"
    spatial_resolution: "~25 km reanalysis grid"
    temporal_resolution: "Daily (sub-daily available)"
    auth: "none"
    variables: "precipitation_sum, temperature_2m_mean"
    implementation_status: implemented_and_tested
    verification_date: "2026-10-28"

  - id: noaa-cpc-enso
    name: "NOAA CPC Oceanic Niño Index (ONI)"
    publisher: "NOAA Climate Prediction Center"
    url: "https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/ensostuff/ONI_v5.php"
    api: "https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt"
    license: "U.S. Government public domain"
    geographic_coverage: "Niño-3.4 index (basin-scale; no per-island data)"
    spatial_resolution: "n/a (index)"
    temporal_resolution: "Monthly (3-month overlapping seasons), 1950-present"
    update_frequency: "Monthly"
    auth: "none"
    variables: "ONI SST anomaly (the canonical ENSO index)"
    implementation_status: implemented_and_tested
    verification_date: "2026-10-28"
    notes: "Authoritative machine-readable ENSO index. Phase label is derived via the CPC >=5-season criterion; the official status statement is the Diagnostic Discussion."

  - id: noaa-cpc-enso-discussion
    name: "NOAA CPC ENSO Diagnostic Discussion"
    publisher: "NOAA Climate Prediction Center"
    url: "https://www.cpc.ncep.noaa.gov/products/analysis_monitoring/enso_advisory/ensodisc.html"
    license: "U.S. Government public domain"
    geographic_coverage: "Global ENSO state + official probabilistic outlook"
    temporal_resolution: "Monthly (2nd Thursday)"
    auth: "none"
    variables: "ENSO Alert System status, Niño indices, synopsis, outlook probabilities"
    implementation_status: planned
    notes: "Narrative/HTML (no structured file); scrape alert status + synopsis. Not yet implemented."

  - id: noaa-ibtracs
    name: "IBTrACS v04r01 (International Best Track Archive)"
    publisher: "NOAA/NCEI"
    url: "https://www.ncei.noaa.gov/products/international-best-track-archive"
    api: "https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv/ibtracs.WP.list.v04r01.csv"
    license: "Public (cite DOI 10.25921/82ty-9e16)"
    geographic_coverage: "Western North Pacific basin (covers Palau/FSM/RMI)"
    spatial_resolution: "Point track (6-hourly synoptic)"
    temporal_resolution: "1842-present"
    update_frequency: "3x/week"
    auth: "none"
    variables: "position, WMO wind/pressure (JMA 10-min for WP), per-agency wind (USA/Tokyo), radii"
    implementation_status: implemented_and_tested
    verification_date: "2026-10-28"

  - id: jma-rsmc-tokyo
    name: "JMA RSMC Tokyo-Typhoon Center (active storms)"
    publisher: "Japan Meteorological Agency"
    url: "https://www.jma.go.jp/bosai/map.html"
    api: "https://www.jma.go.jp/bosai/typhoon/data/targetTc.json"
    license: "JMA legal notice (observational data)"
    geographic_coverage: "Western North Pacific (RSMC Tokyo AOR; covers all FAS)"
    spatial_resolution: "Point (position + 70% probability circles)"
    temporal_resolution: "Advisories every 3h; 5-day forecast"
    update_frequency: "Every 3h"
    auth: "none"
    variables: "position, central pressure, 10-min sustained wind, gusts, 30/50-kt radii, forecast track + probability circles"
    implementation_status: implemented_and_tested
    verification_date: "2026-10-28"
    notes: "Authoritative active-storm source (WMO RSMC). JSON endpoints, no auth."

  - id: jtwc-advisories
    name: "JTWC tropical cyclone warnings"
    publisher: "Joint Typhoon Warning Center (via NWS text mirror)"
    url: "https://www.metoc.navy.mil/jtwc/jtwc.html"
    api: "https://tgftp.nws.noaa.gov/data/raw/wt/wtpn31.pgtw..txt"
    license: "U.S. Government public domain"
    geographic_coverage: "NW Pacific (covers FAS)"
    temporal_resolution: "6-hourly warnings + 5-day forecast"
    update_frequency: "6-hourly"
    auth: "none"
    variables: "1-min sustained wind, quadrant wind radii (34/50/64 kt), MSLP, forecast track"
    implementation_status: implemented_and_tested
    verification_date: "2026-10-28"
    notes: "ATCF-style text warnings parsed into structured data (position, 1-min wind, radii, forecast). Complements JMA (10-min wind)."

  - id: jma-himawari
    name: "JMA Himawari-9 geostationary satellite imagery"
    publisher: "JMA / NICT"
    url: "https://himawari8.nict.go.jp/"
    api: "https://himawari8.nict.go.jp/img/D531106/1d/1100/{date}/{time}_0_0.png"
    license: "JMA/NICT terms (attribution)"
    geographic_coverage: "Full disk (80E–160W; FAS in western-Pacific portion)"
    spatial_resolution: "~0.5–2 km (full-disk composite; higher-zoom tiles available)"
    temporal_resolution: "10-minute cadence"
    update_frequency: "every 10 minutes"
    auth: "none"
    variables: "visible composite imagery"
    implementation_status: implemented_and_tested
    verification_date: "2026-10-28"
    notes: "Full-disk composite shown in the app (Tropical Cyclones page). IR bands and region zoom tiles are a follow-up."

  - id: nws-guam
    name: "NWS Guam / PEAC (FAS watches & warnings)"
    publisher: "NOAA NWS Pacific Region"
    url: "https://www.weather.gov/gum/"
    api: "https://tgftp.nws.noaa.gov/data/raw/wt/wtpq31.pgum.tcp.pq1.txt"
    license: "U.S. Government public domain"
    geographic_coverage: "Marianas + Micronesia (Palau, FSM, RMI island-specific)"
    temporal_resolution: "Advisory/local statement"
    update_frequency: ">=6-hourly"
    auth: "none"
    variables: "storm identity, island-level watches/warnings"
    implementation_status: implemented_and_tested
    verification_date: "2026-10-28"
    notes: "TCP text parsed (storm + watches/warnings). api.weather.gov/alerts also available for structured zone alerts. The only source that turns JTWC/JMA guidance into FAS island-specific actions."

  - id: nasa-gpm-imerg
    name: "NASA GPM IMERG precipitation (Final/Late/Early)"
    publisher: "NASA GES DISC"
    url: "https://gpm.nasa.gov/data/imerg"
    license: "NASA open data"
    geographic_coverage: "60N-60S (covers FAS, over ocean + land)"
    spatial_resolution: "0.1 deg (~11 km)"
    temporal_resolution: "30-min / daily / monthly; 2000-present"
    update_frequency: "Early ~4h, Late ~14h, Final ~3.5 months"
    auth: "requires Earthdata Login"
    variables: "precipitationCal, randomError, probabilityLiquidPrecipitation"
    implementation_status: implemented_and_tested
    verification_date: "2026-10-28"
    notes: "earthaccess adapter (ingestion/imerg.py) for daily point extraction; live-verified (token auth + search + download + extraction). Requires EARTHDATA_TOKEN (or ~/.netrc) and a one-time GPM IMERG EULA acceptance."

  - id: chirps-v3
    name: "CHIRPS v3 precipitation (UCSB Climate Hazards Center)"
    publisher: "UC Santa Barbara"
    url: "https://www.chc.ucsb.edu/data/chirps3"
    api: "https://data.chc.ucsb.edu/products/CHIRPS/v3.0/"
    license: "CC BY 4.0 (v2 was CC0)"
    geographic_coverage: "60N-60S (land-masked; tiny atolls may be sparse)"
    spatial_resolution: "0.05 deg (~5.5 km)"
    temporal_resolution: "monthly (daily/pentad/dekad also available), 1981-present"
    update_frequency: "preliminary every ~5 days; final monthly"
    auth: "none"
    variables: "precip (mm)"
    implementation_status: implemented_and_tested
    verification_date: "2026-10-28"
    notes: "Point extraction via COG range requests (rasterio /vsicurl). Land-masked; sub-pixel islands use a documented max-valid-pixel heuristic. ERA5 preferred for ocean-adjacent atolls."

  - id: persiann-cdr
    name: "PERSIANN-CDR precipitation (NOAA CDR)"
    publisher: "NOAA NCEI / UC Irvine CHRS"
    url: "https://www.ncei.noaa.gov/products/climate-data-records/precipitation-persiann"
    license: "U.S. Government open data"
    geographic_coverage: "60S-60N (covers FAS)"
    spatial_resolution: "0.25 deg daily (CDR); 0.04 deg 3-hourly (CCS-CDR)"
    temporal_resolution: "1983-present"
    auth: "none (NCEI); registration for CHRS bulk"
    variables: "precipitation"
    implementation_status: planned

  - id: gpcc-monthly
    name: "GPCC monthly gauge precipitation"
    publisher: "DWD (Deutscher Wetterdienst)"
    url: "https://opendata.dwd.de/climate_environment/GPCC/"
    license: "DWD terms (attribution)"
    geographic_coverage: "Land only — essentially no gauges on FAS islands (not recommended)"
    spatial_resolution: "0.25/0.5/1.0/2.5 deg"
    temporal_resolution: "monthly, 1891-present"
    auth: "none"
    variables: "precip, numgauge"
    implementation_status: planned
    notes: "Not a primary FAS source (no local gauges)."

  - id: speibase
    name: "SPEIbase (global standardized precipitation-evapotranspiration index)"
    publisher: "CSIC"
    url: "https://spei.csic.es/database.html"
    api: "https://spei.csic.es/spei_database"
    license: "ODbL 1.0"
    geographic_coverage: "Global land 0.5 deg — many FAS atolls fall between cells (NaN)"
    temporal_resolution: "monthly, SPEI 1-48 months, 1901-present"
    auth: "none"
    variables: "SPEI"
    implementation_status: planned
    notes: "Coarse; better to compute SPI/SPEI ourselves from CHIRPS/IMERG."

  - id: noaa-nmme
    name: "NMME seasonal forecasts (multi-model ensemble)"
    publisher: "NOAA/NCEP + partners"
    url: "https://www.ncei.noaa.gov/products/weather-climate-models/north-american-multi-model"
    api: "https://ftp.cpc.ncep.noaa.gov/International/nmme/netcdf/"
    license: "NOAA open data"
    geographic_coverage: "Global 1 deg (FAS falls within grid cells)"
    temporal_resolution: "monthly inits, 12-month horizon, 2011-present"
    update_frequency: "monthly"
    auth: "none"
    variables: "prate, tmp2m, tmpsfc (NetCDF3)"
    implementation_status: implemented_and_tested
    verification_date: "2026-10-28"
    notes: "xarray + netCDF4 point extraction of ENSMEAN across 6 models; ensemble mean/spread. 1-deg grid is coarse for atolls."

  - id: ecmwf-aifs
    name: "ECMWF AIFS open data (AI forecast)"
    publisher: "ECMWF"
    url: "https://www.ecmwf.int/en/forecasts/datasets/open-data"
    api: "s3://ecmwf-forecasts (no account: --no-sign-request)"
    license: "CC BY 4.0 + ECMWF terms"
    geographic_coverage: "Global 0.25 deg (covers FAS)"
    temporal_resolution: "4 runs/day, 6-hourly to 360h (15 days)"
    update_frequency: "4x/day"
    auth: "none"
    variables: "2m temp/dewpoint, 10m wind, total precipitation, MSLP, pressure levels (GRIB2)"
    implementation_status: planned
    notes: "Best free AI/global model drop-in (GRIB2). See docs."

  - id: noaa-gfs
