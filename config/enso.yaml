# COFA FORWARD — ENSO configuration
# Current-state classification MUST come from an authoritative source. Until the
# NOAA CPC ONI adapter is implemented (Phase 3), current state is UNAVAILABLE —
# we do not infer a phase from an old report or a model guess.
current_state:
  status: "unavailable"
  phase: null
  as_of: null
  source: null
  note: "No authoritative ENSO source is configured yet. CPC ONI ingestion is planned (Phase 3)."

oni_thresholds:
  # NOAA CPC Oceanic Nino Index (3-month running mean of Nino 3.4 SST anomaly).
  el_nino: 0.5
  la_nina: -0.5
  window_months: 3
  base_period: "1991-2020"

# Historical ENSO episode catalog (SEED — approximate ONI-based windows).
# Dates are candidate periods for reconstruction, NOT verified exact start/peak/
# end dates. They must be validated against NOAA CPC ONI records before use in
# production analysis. intensity is an approximate qualitative label.
