# COFA FORWARD — geographic registry (SEED DATA)
# ---------------------------------------------------------------------------
# These coordinates are APPROXIMATE seed locations, drawn from public gazetteer
# knowledge, NOT authoritative boundaries. They are sufficient to drive the map
# and to attribute coarse-grid model data to representative points, but they do
# NOT constitute a validated geographic inventory.
#
# NEVER treat these as precise atoll-scale boundaries or surveyed coordinates.
# The registry is designed so a complete, validated FAS island/atoll inventory
# can replace this file later WITHOUT changing core application code.
# ---------------------------------------------------------------------------
