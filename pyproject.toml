[project]
name = "cofa-forward"
version = "0.1.0"
description = "COFA FORWARD — Weather Operations & Anticipatory Climate Intelligence for the Freely Associated States (Palau, FSM, RMI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "rasterio>=1.4.4",
    "pyshp>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cofa_forward"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests requiring live network access (skipped by default)",
]
addopts = "-m 'not network' -q"
