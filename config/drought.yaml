# COFA FORWARD — drought & freshwater configuration
drought:
  rolling_windows_months: [1, 3, 6, 12]
  baseline_start: "1991-01-01"
  baseline_end: "2020-12-31"
  baseline_min_years: 15        # reject anomaly if fewer than this many valid baseline years
  percentile_anchor: "1991-2020"
  percentile_categories:
    # empirical percentile -> descriptive drought severity label
    - { min: 0.0,  max: 0.05, label: "Exceptional dry" }
    - { min: 0.05, max: 0.10, label: "Extreme dry" }
    - { min: 0.10, max: 0.20, label: "Severe dry" }
    - { min: 0.20, max: 0.30, label: "Moderate dry" }
    - { min: 0.30, max: 0.70, label: "Near normal" }
    - { min: 0.70, max: 0.80, label: "Moderate wet" }
    - { min: 0.80, max: 0.90, label: "Severe wet" }
    - { min: 0.90, max: 0.95, label: "Extreme wet" }
    - { min: 0.95, max: 1.01, label: "Exceptional wet" }

spi:
  # Standardized Precipitation Index (not implemented in v0.1.0; see docs/SCIENTIFIC_METHODS.md)
  enabled: false
  distribution: "gamma"
  note: "Percentile-based indicators are implemented first per the build plan."

freshwater:
  # Framework for freshwater vulnerability. Inputs that are NOT available must
  # NOT be fabricated into a composite score. Meteorological indicators and a
  # clearly-labeled modeled water-balance forecast are computed; actual shortage
  # is never inferred from rainfall alone.
  available_inputs: []
  missing_inputs:
    - "Freshwater lens characteristics"
    - "Rainwater storage / catchment capacity"
    - "Desalination or alternative supply capacity"
    - "Water demand / abstraction data"
    - "Documented historical water shortages (structured)"
    - "Local water advisories"
  note: "Do not infer actual freshwater shortage from a rainfall anomaly alone."
  water_balance:
    # Documented PLANNING DEFAULTS for the modeled water-need forecast. These are
    # NOT measured site data — see docs/SCIENTIFIC_METHODS.md. Override per entity
    # in per_entity below when real catchment/storage/desalination data exists.
    per_capita_lpd: 100.0            # litres/person/day (WHO basic domestic access ~50-100)
    per_person_catchment_m2: 10.0    # assumed effective roof catchment per person
    collection_efficiency: 0.8       # fraction of rainfall collected
    storage_l: null                  # assumed storage (null -> 0, conservative)
    note: >
      Modeled estimate using documented planning defaults. Actual catchment,
      storage, desalination, and abstraction data are MISSING for all seed
      locations and are listed rather than fabricated.
    per_entity: {}                   # e.g. {"PAL-KOR": {"per_capita_lpd": 120, "storage_l": 50000}}
