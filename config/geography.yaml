# COFA FORWARD — geographic registry
# ---------------------------------------------------------------------------
# Coordinates are APPROXIMATE representative points drawn from public gazetteer
# knowledge, NOT authoritative boundaries. They are sufficient to drive the map
# and to attribute coarse-grid model data to representative points, but they do
# NOT constitute a validated geographic inventory.
#
# POPULATION figures are the MOST RECENT OFFICIAL CENSUSES — RMI 2021 (EPPSO),
# FSM 2023 (national) / 2010 (municipality-level, the latest published for
# outer islands), Palau 2020 — and are recorded with their year and source in
# ``population_year`` / ``population_source`` so the app never overstates an
# estimate. All three countries are shrinking through out-migration under the
# Compact of Free Association (movement to the US/Guam/Hawaii), so figures move
# DOWNWARD between censuses. Where an atoll/municipality figure was not
# published in the latest census, ``population`` is null (never guessed).
#
# ``airport`` and ``port`` are the known transport infrastructure per entity
# (international airports, commercial ports, outer-island airstrips and docks).
# ---------------------------------------------------------------------------
