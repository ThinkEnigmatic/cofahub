<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COFAHUB — FAS Climate Intelligence</title>
    <script>
      // Anti-flash: apply the stored/system theme before the app paints.
      (function () {
        var t = localStorage.getItem("cofahub_theme") || "system";
        var dark =
          t === "dark" ||
          (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
